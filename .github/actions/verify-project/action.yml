name: Verify Project
description: Install dependencies and run static checks, unit tests and build

runs:
  using: composite

  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Cache Turborepo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Prisma Client must exist before lint/typecheck: without it
    # PrismaService has no model delegates and every repository fails
    - name: Generate Prisma Client
      shell: bash
      run: pnpm --filter api prisma:generate

    # Пока в репозитории есть неотформатированные файлы (см. FIX.md, "prettier --check падает"),
    # шаг красный. Когда формат будет приведён отдельным коммитом, он станет обязательным без правок.
    - name: Prettier
      shell: bash
      run: pnpm format:check

    # api: lint:check без --fix, чтобы CI не правил файлы молча
    - name: Lint
      shell: bash
      run: |
        pnpm turbo run lint --filter='!api'
        pnpm --filter api lint:check

    # Включает packages/e2e (tsc --noEmit)
    - name: Typecheck
      shell: bash
      run: pnpm turbo run typecheck

    - name: Unit Tests
      shell: bash
      run: pnpm turbo run test

    - name: Build
      shell: bash
      run: pnpm turbo run build

    # Обязательный шаг: high и critical в prod-дереве валят CI (транзитивные закрыты pnpm.overrides в корне)
    - name: Audit (prod, high+)
      shell: bash
      run: pnpm audit --prod --audit-level=high
