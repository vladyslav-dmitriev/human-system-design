name: Cleanup GHCR Images

on:
  schedule:
    - cron: "0 2 * * 0" # Every Sunday at 02:00 UTC

  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

env:
  OWNER: vladyslav-dmitriev

jobs:
  cleanup-api:
    name: Cleanup API Images

    runs-on: ubuntu-latest

    steps:
      - name: Delete old API container versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: human-system-design-api
          package-type: container
          owner: ${{ env.OWNER }}

          min-versions-to-keep: 20

          # теги sha-* уникальны, поэтому чистим по количеству версий, не только untagged
          delete-only-untagged-versions: false

          token: ${{ secrets.GITHUB_TOKEN }}

  # cleanup-web: добавить вместе с образом human-system-design-web
