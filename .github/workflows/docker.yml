name: Build & Push Docker Images

# Образ пушится только после зелёного CI на main (push), и только из того же коммита.
on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vladyslav-dmitriev

jobs:
  docker:
    name: Build and push ${{ matrix.service }}

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            target: prod
            image: human-system-design-api
          - service: web
            target: web
            image: human-system-design-web

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate NEXT_PUBLIC_* variables
        if: matrix.service == 'web'
        env:
          API_CLIENT_URL: ${{ vars.NEXT_PUBLIC_API_CLIENT_URL }}
          API_SERVER_URL: ${{ vars.NEXT_PUBLIC_API_SERVER_URL || 'http://api:3001' }}
          STRIPE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
        run: |
          if [ -z "$API_CLIENT_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_API_CLIENT_URL is empty: the web image would be built with a broken API URL"
            exit 1
          fi
          if [ -z "$API_SERVER_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_SERVER_URL is empty"
            exit 1
          fi
          if [ -n "$STRIPE_PUBLIC_KEY" ] && [ "${STRIPE_PUBLIC_KEY#pk_}" = "$STRIPE_PUBLIC_KEY" ]; then
            echo "::error::NEXT_PUBLIC_STRIPE_PUBLIC_KEY must start with pk_ (a secret key must never be baked into the web bundle)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          # Тег неизменяемый: sha-<полный коммит>. latest не используем.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          # NEXT_PUBLIC_* инлайнятся в бандл web при сборке. Это публичные значения: берём из Variables
          # репозитория (Settings -> Secrets and variables -> Actions -> Variables), не из secrets. api их игнорирует.
          build-args: |
            NEXT_PUBLIC_API_CLIENT_URL=${{ vars.NEXT_PUBLIC_API_CLIENT_URL }}
            NEXT_PUBLIC_API_SERVER_URL=${{ vars.NEXT_PUBLIC_API_SERVER_URL || 'http://api:3001' }}
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
            NEXT_PUBLIC_GOOGLE_CAPTCHA_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_CAPTCHA_PUBLIC_KEY }}
            NEXT_PUBLIC_CLOUDFLARE_SITE_KEY=${{ vars.NEXT_PUBLIC_CLOUDFLARE_SITE_KEY }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
            NEXT_PUBLIC_GROWTHBOOK_API_HOST=${{ vars.NEXT_PUBLIC_GROWTHBOOK_API_HOST }}
            NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY=${{ vars.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # После того как обе картинки (api и web) запушены, открываем PR, который меняет image.tag в values-prod.yaml,
  # и сразу сливаем его. ArgoCD видит новый коммит в main и выкатывает версию.
  # Почему PR, а не прямой push: на main действует ruleset protect-main (прямые push запрещены, исключений нет).
  # Метка [skip ci] в заголовке: слияние этого PR не должно снова запускать CI, сборку образов и новый PR (цикл).
  # Нужна настройка репозитория: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
  deploy-tag:
    name: Bump image tag in values-prod.yaml

    needs: docker

    if: needs.docker.result == 'success'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Open and merge the deploy PR
        run: |
          set -euo pipefail
          short="${SHA::8}"
          # обе строки `    tag:` (api и web) получают один и тот же тег sha-<полный коммит>
          sed -i -E "s|^(    tag: ).*|\1sha-${SHA}|" infra/helm/app/values-prod.yaml
          if git diff --quiet; then
            echo "Тег уже sha-${SHA}, менять нечего"
            exit 0
          fi
          branch="ci/deploy-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(deploy): images sha-${short} [skip ci]"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "chore(deploy): images sha-${short} [skip ci]" \
            --body "Автоматически: образы api и web для коммита ${SHA} собраны и запушены в GHCR. Меняет image.tag в values-prod.yaml, дальше ArgoCD выкатывает версию.")"
          gh pr merge "$url" --squash --delete-branch
