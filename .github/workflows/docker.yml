name: Build & Push Docker Images

# Образы собираются только после успешного CI на main (push в main).
# workflow_run всегда выполняется в контексте default-ветки, поэтому код берём по head_sha
# и теги считаем сами, а не через github.sha / github.ref.
on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vladyslav-dmitriev

jobs:
  docker:
    name: Image ${{ matrix.service }}

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: hsd-api
            build_args: ""
          - service: web
            image: hsd-web
            # NEXT_PUBLIC_* инлайнятся в бандл при `next build`, они публичные: берём из Variables, не из Secrets.
            # Settings -> Secrets and variables -> Actions -> Variables.
            build_args: |
              NEXT_PUBLIC_API_CLIENT_URL=${{ vars.NEXT_PUBLIC_API_CLIENT_URL }}
              NEXT_PUBLIC_API_SERVER_URL=${{ vars.NEXT_PUBLIC_API_SERVER_URL }}
              NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
              NEXT_PUBLIC_GOOGLE_CAPTCHA_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_CAPTCHA_PUBLIC_KEY }}
              NEXT_PUBLIC_CLOUDFLARE_SITE_KEY=${{ vars.NEXT_PUBLIC_CLOUDFLARE_SITE_KEY }}
              NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
              NEXT_PUBLIC_GROWTHBOOK_API_HOST=${{ vars.NEXT_PUBLIC_GROWTHBOOK_API_HOST }}
              NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY=${{ vars.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY }}

    steps:
      - name: Checkout (commit, прошедший CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Short SHA
        id: vars
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.short }}
            type=raw,value=main
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          build-args: ${{ matrix.build_args }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
