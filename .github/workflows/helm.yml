name: Helm

on:
  pull_request:
    paths:
      - "infra/helm/**"
      - "infra/argocd/applications/monitoring.yaml"
      - ".github/workflows/helm.yml"
  push:
    branches:
      - main
    paths:
      - "infra/helm/**"
      - "infra/argocd/applications/monitoring.yaml"
      - ".github/workflows/helm.yml"

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & template
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Helm предустановлен в образе ubuntu-latest: без стороннего action
      - name: Helm version
        run: helm version

      - name: Lint charts
        run: |
          helm lint infra/helm/app -f infra/helm/app/values-local.yaml
          helm lint infra/helm/app -f infra/helm/app/values-prod.yaml
          helm lint infra/helm/deps

      - name: Render charts
        run: |
          helm template app infra/helm/app -n app -f infra/helm/app/values-local.yaml > /dev/null
          helm template app infra/helm/app -n app -f infra/helm/app/values-prod.yaml > /dev/null
          helm template deps infra/helm/deps -n app > /dev/null

  # Внешний чарт мониторинга (его ставит ArgoCD, см. infra/argocd/applications/monitoring.yaml):
  # рендерим с нашими values, чтобы схема чарта поймала опечатки в ключах до выката.
  monitoring:
    name: Render monitoring chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Render k8s-monitoring
        run: |
          VERSION="$(sed -n 's/^ *targetRevision: *\(4\.[0-9.]*\).*/\1/p' infra/argocd/applications/monitoring.yaml | head -1)"
          test -n "$VERSION"
          helm repo add grafana https://grafana.github.io/helm-charts
          helm template k8s-monitoring grafana/k8s-monitoring --version "$VERSION" \
            -n monitoring -f infra/helm/monitoring/values.yaml > /dev/null
