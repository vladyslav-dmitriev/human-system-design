name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Project

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-project

  # Интеграционные тесты api (apps/api/test) и black-box против запущенной сборки
  api-e2e:
    name: API integration (Postgres, Redis, RabbitMQ)

    runs-on: ubuntu-latest

    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Значения ниже одноразовые, только для CI (не секреты)
    env:
      NODE_ENV: test
      SERVER_PORT: "3001"
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_SECRET: ci-only-jwt-secret-0123456789-0123456789
      AUTH_SECRET: ci-only-auth-secret-0123456789
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      AWS_S3_BUCKET_NAME: ci-placeholder
      EMAIL_PROVIDER: sendgrid
      EMAIL_FROM: ci@example.test
      EMAIL_VERIFICATION_SECRET: ci-only-email-verification-secret-0123456789
      INTERNAL_API_SECRET: ci-only-internal-api-secret-0123456789-0123
      SENDGRID_API_KEY: SG.ci-placeholder
      RESEND_API_KEY: re_ci_placeholder
      TWILIO_SID: ACci00000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder
      TWILIO_VERIFY_SERVICE_SID: VAci00000000000000000000000000000
      GOOGLE_CAPTCHA_SECRET_KEY: ci-placeholder
      # /metrics закрыт флагом (вне production он включён по умолчанию); blackbox-тест проверяет закрытость
      ENABLE_METRICS: "false"
      API_E2E_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Build api
        run: pnpm --filter api build

      - name: Start api
        run: |
          nohup pnpm --filter api start:prod > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then
              echo "api is up"; exit 0
            fi
            sleep 2
          done
          echo "api did not become healthy"; cat api.log; exit 1

      - name: API integration tests
        run: pnpm --filter api test:e2e

      - name: Show api log on failure
        if: failure()
        run: cat api.log || true

  # Собранный прод-образ должен реально стартовать (ловит неверный CMD и пропавшие зависимости)
  docker-smoke:
    name: Docker image smoke

    runs-on: ubuntu-latest

    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: false
          load: true
          tags: api-ci:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image and check /health
        run: |
          docker run -d --name api-smoke --network host \
            -e NODE_ENV=production \
            -e SERVER_PORT=3001 \
            -e CLIENT_URL=http://localhost:3000 \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e RABBITMQ_URL=amqp://guest:guest@127.0.0.1:5672 \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789-0123456789 \
            -e AUTH_SECRET=ci-only-auth-secret-0123456789 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_placeholder \
            -e AWS_REGION=eu-central-1 \
            -e AWS_ACCESS_KEY_ID=ci-placeholder \
            -e AWS_SECRET_ACCESS_KEY=ci-placeholder \
            -e AWS_S3_BUCKET_NAME=ci-placeholder \
            -e EMAIL_PROVIDER=sendgrid \
            -e EMAIL_FROM=ci@example.test \
            -e EMAIL_VERIFICATION_SECRET=ci-only-email-verification-secret-0123456789 \
            -e INTERNAL_API_SECRET=ci-only-internal-api-secret-0123456789-0123 \
            -e SENDGRID_API_KEY=SG.ci-placeholder \
            -e RESEND_API_KEY=re_ci_placeholder \
            -e TWILIO_SID=ACci00000000000000000000000000000 \
            -e TWILIO_AUTH_TOKEN=ci-placeholder \
            -e TWILIO_VERIFY_SERVICE_SID=VAci00000000000000000000000000000 \
            -e GOOGLE_CAPTCHA_SECRET_KEY=ci-placeholder \
            api-ci:smoke
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then
              echo "image is healthy"; exit 0
            fi
            sleep 2
          done
          echo "image did not become healthy"; docker logs api-smoke; exit 1

  dependency-review:
    name: Dependency review

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
