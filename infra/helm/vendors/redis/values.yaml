architecture: standalone

auth:
  enabled: false

# session-version и идемпотентность вебхуков живут только в Redis: AOF и без вытеснения ключей
commonConfiguration: |-
  appendonly yes
  save ""
  maxmemory-policy noeviction

master:
  persistence:
    enabled: true
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 250m
      memory: 256Mi