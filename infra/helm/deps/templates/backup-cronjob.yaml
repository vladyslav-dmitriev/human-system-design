{{- if and .Values.postgres.enabled .Values.backup.enabled }}
# Ежесуточный бэкап Postgres в Cloudflare R2.
# initContainer dump делает pg_dump в общий emptyDir, контейнер upload (rclone) кладёт файл в бакет и чистит старые копии.
# Восстановление на пустой базе делает хук чарта app (templates/restore-job.yaml) из postgres/latest.dump.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    {{- include "deps.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "deps.labels" . | nindent 12 }}
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: {{ .Values.postgres.image | quote }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  pg_dump --format=custom --no-owner --no-privileges --file=/backup/mydb.dump
                  # пустой или обрезанный файл не отправляем: лучше упасть, чем затереть latest.dump мусором
                  test -s /backup/mydb.dump
                  ls -l /backup/mydb.dump
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: {{ .Values.postgres.user | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret }}
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: upload
              image: {{ .Values.backup.rcloneImage | quote }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  [ -n "${R2_BUCKET:-}" ] || { echo "Секрет {{ .Values.backup.existingSecret }} не найден или пуст"; exit 1; }
                  ts="$(date -u +%Y%m%d-%H%M%S)"
                  rclone copyto /backup/mydb.dump "r2:${R2_BUCKET}/postgres/mydb-${ts}.dump"
                  rclone copyto /backup/mydb.dump "r2:${R2_BUCKET}/postgres/latest.dump"
                  # старые копии (latest.dump остаётся: имя не подходит под mydb-*.dump)
                  rclone delete "r2:${R2_BUCKET}/postgres" --include "mydb-*.dump" --min-age "{{ .Values.backup.retentionDays }}d"
                  echo "бэкап mydb-${ts}.dump загружен"
              env:
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                # токен R2 ограничен бакетами: создавать бакет он не может
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: R2_ACCESS_KEY_ID
                      optional: true
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: R2_SECRET_ACCESS_KEY
                      optional: true
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: R2_ENDPOINT
                      optional: true
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: R2_BUCKET
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
