# Зависимости приложения. Ставятся ДО чарта app: helm upgrade --install deps infra/helm/deps -n app
#
# Имена Service (на них ссылается api), фиксированы:
#   postgres:5432   redis:6379   rabbitmq:5672 (AMQP), rabbitmq:15672 (management), rabbitmq:15692 (prometheus)
#
# Пароли в values не хранятся: Secret создаётся вне чарта (локально скриптом, на сервере Sealed Secrets).
# Ключи Secret (secrets.existingSecret):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, RABBITMQ_PASSWORD
# Те же пароли нужны в Secret api (DATABASE_URL, REDIS_URL, RABBITMQ_URL).

secrets:
  existingSecret: app-deps

# Образы: официальные, версии закреплены (как в docker-compose.yml)
postgres:
  enabled: true
  image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
  user: user
  database: mydb
  storage: 5Gi
  storageClassName: "" # пусто = класс по умолчанию (minikube: standard, k3s: local-path)
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi

redis:
  enabled: true
  image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
  user: admin
  vhost: /
  storage: 2Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Ежесуточный бэкап Postgres в бакет Cloudflare R2: pg_dump (формат custom) + загрузка rclone.
# Файлы: postgres/mydb-<UTC дата-время>.dump (хранятся retentionDays суток) и postgres/latest.dump (его берёт восстановление).
# Секрет existingSecret (создаёт infra/scripts/seal-secrets.sh --r2) с ключами:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT (https://<id аккаунта>.r2.cloudflarestorage.com), R2_BUCKET
backup:
  enabled: false # включается в Application deps (прод); локально бэкапов нет
  schedule: "0 3 * * *" # UTC
  retentionDays: 14
  rcloneImage: rclone/rclone:1.68.2@sha256:74c51b8817e5431bd6d7ed27cb2a50d8ee78d77f6807b72a41ef6f898845942b
  existingSecret: postgres-backup-r2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# NetworkPolicy: postgres/redis/rabbitmq принимают только api и Job миграций чарта app
networkPolicy:
  enabled: true
  appName: app # app.kubernetes.io/name чарта app
  monitoringNamespace: monitoring
