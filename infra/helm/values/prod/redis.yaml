architecture: replication

auth:
  enabled: true

# session-version и идемпотентность вебхуков живут только в Redis: AOF и без вытеснения ключей
commonConfiguration: |-
  appendonly yes
  save ""
  maxmemory-policy noeviction

master:
  persistence:
    enabled: true
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: "1"
      memory: 2Gi

replica:
  replicaCount: 2