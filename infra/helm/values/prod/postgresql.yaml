auth:
  username: app
  # Пароли берутся из существующего Secret (создаёт человек / External Secrets / Sealed Secrets,
  # в git значения не кладём). Secret в namespace `database` с ключами:
  #   password          - пароль пользователя `app`
  #   postgres-password - пароль суперпользователя
  existingSecret: postgres-credentials
  secretKeys:
    userPasswordKey: password
    adminPasswordKey: postgres-password
  database: app

primary:
  persistence:
    enabled: true
    storageClass: standard
    size: 50Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi

  limits:
    cpu: "2"
    memory: 4Gi