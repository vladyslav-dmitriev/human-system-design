{{- if .Values.ingress.enabled }}
{{- $traefik := eq .Values.ingress.className "traefik" }}
{{- $mw := printf "%s-%s" .Release.Namespace (include "app.fullname" .) }}
{{- /*
Два Ingress, потому что Traefik-middleware (strip /api) вешается на весь Ingress целиком:
/api/auth и / должны идти в web БЕЗ среза префикса, а /api -> api С срезом.
Правила повторяют nginx/templates/default.conf.template.
*/}}
# Ingress web: /api/auth -> web, /api/metrics -> 404 (web), / -> web
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # NextAuth живёт в web (location /api/auth/ в nginx)
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: {{ .Values.web.port }}
          # /api/metrics наружу не отдаём: Next отвечает 404 (в nginx: return 404).
          # Другие написания и прочие внутренние пути режет middleware block-internal в Ingress api.
          - path: /api/metrics
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: {{ .Values.web.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: {{ .Values.web.port }}
---
# Ingress api: /api/* -> api со срезанием префикса /api
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}-api
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- if $traefik }}
    # порядок важен: сначала блокировка внутренних путей (в любом регистре), потом срез префикса /api
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }}-block-internal@kubernetescrd,{{ $mw }}-strip-api@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port }}
{{- if $traefik }}
---
apiVersion: {{ .Values.ingress.traefik.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}-strip-api
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: {{ .Values.ingress.traefik.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}-block-internal
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # Наружу не отдаём (как return 404 в nginx): метрики Prometheus, внутренний service-auth/validate
  # (его зовёт только web изнутри кластера) и Swagger. Express не различает регистр и хвостовой слэш,
  # а Traefik сопоставляет путь с учётом регистра, поэтому regex (?i) и необязательный /.
  # Такой путь переписываем в несуществующий, после strip-api Nest ответит 404.
  replacePathRegex:
    regex: "(?i)^/api/(metrics/?|service-auth/validate/?|docs.*)$"
    replacement: "/api/__blocked__"
{{- end }}
{{- end }}
