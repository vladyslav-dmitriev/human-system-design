{{- if .Values.migrations.enabled }}
# prisma migrate deploy перед установкой и каждым обновлением.
# Postgres должен быть уже запущен (чарт infra/helm/deps ставится раньше); пока БД недоступна, Job ретраится (backoffLimit).
# Миграции применяются до выката нового кода, поэтому они должны быть обратно совместимыми (expand/contract).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-migrate
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: migrate
          image: {{ include "app.image" (dict "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/opt/prisma/node_modules/.bin/prisma", "migrate", "deploy"]
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          # из Secret api нужен только DATABASE_URL (остальные секреты Job не получает)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.existingSecret обязателен" .Values.api.existingSecret }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
