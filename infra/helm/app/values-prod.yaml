# Сервер (k3s, 4 GB RAM): образы из GHCR, TLS через cert-manager.
# Тег образа обновляет CI (фаза 5: коммит `[skip ci]`), руками не править без причины.
api:
  replicas: 1
  image:
    repository: ghcr.io/vladyslav-dmitriev/human-system-design-api
    tag: sha-e78bff6537c1c55ff27c34595adf43414e418d19
    pullPolicy: IfNotPresent
  # Реальные ключи сторонних сервисов (Stripe, почта, R2 и т.д.) перекрывают заглушки из app-api.
  # SealedSecret app-api-overrides создаёт infra/scripts/seal-secrets.sh --overrides; без него секрет просто не подключается.
  overridesSecret: app-api-overrides
  # Alloy (namespace monitoring) собирает /metrics с пода api: http_requests_total и http_request_duration_seconds
  podAnnotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/metrics.path: /metrics
    k8s.grafana.com/metrics.portNumber: "3001"
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi

web:
  replicas: 1
  image:
    repository: ghcr.io/vladyslav-dmitriev/human-system-design-web
    tag: sha-e78bff6537c1c55ff27c34595adf43414e418d19
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

config:
  api:
    NODE_ENV: production
    # На проде платные SMS включаются значением "enabled", иначе проверка кода всегда проходит
    PAID_API: "false"
    # На проде /metrics по умолчанию отвечает 404; включаем для внутреннего сбора (NetworkPolicy пускает только namespace monitoring)
    ENABLE_METRICS: "true"
    # Письма уходят через Resend: домен подтверждается DNS-записями из infra/terraform/email-dns.tf,
    # ключ RESEND_API_KEY лежит в SealedSecret app-api-overrides. EMAIL_FROM (noreply@домен) задаёт SealedSecret app-api.
    EMAIL_PROVIDER: resend

ingress:
  className: traefik
  # Адрес приложения: A-запись создаёт Terraform (infra/terraform/dns.tf), output `app_host`.
  # Хост должен совпадать с хостом в NEXT_PUBLIC_API_CLIENT_URL, с которым собран образ web.
  host: app.vladyslavdmitriev.com
  tls:
    enabled: true
    secretName: app-tls
    clusterIssuer: letsencrypt-prod # TODO: имя ClusterIssuer из infra/k8s/clusterissuer.yaml (фаза 4)

networkPolicy:
  ingressControllerNamespace: kube-system # Traefik во встроенном k3s

# Одноразовый сервер: на пустой базе поднимаем данные из последнего бэкапа в R2
restore:
  enabled: true
