# Общие значения чарта app. Отличия окружений: values-local.yaml (minikube) и values-prod.yaml (сервер).
#
# Секреты в чарт НЕ кладутся. Secret'ы создаются вне чарта: локально скриптом из apps/*/.env,
# на сервере через Sealed Secrets. Чарт только ссылается на них по имени (existingSecret).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

api:
  enabled: true
  replicas: 1
  port: 3001 # должен совпадать с SERVER_PORT
  image:
    repository: ghcr.io/vladyslav-dmitriev/human-system-design-api
    tag: "" # обязателен, задаётся в values-окружения
    pullPolicy: IfNotPresent
  # Secret с переменными api (создаётся вне чарта). Ключи как в apps/api/.env.example:
  #   DATABASE_URL, REDIS_URL, RABBITMQ_URL, JWT_SECRET, AUTH_SECRET, STRIPE_*, AWS_*, SENDGRID_API_KEY, ...
  # Адреса зависимостей внутри кластера (чарт infra/helm/deps, namespace тот же):
  #   DATABASE_URL=postgresql://<user>:<password>@postgres:5432/<db>
  #   REDIS_URL=redis://:<password>@redis:6379
  #   RABBITMQ_URL=amqp://<user>:<password>@rabbitmq:5672/
  existingSecret: app-api
  # Необязательный Secret, перекрывающий ключи existingSecret (подключается с optional: true). Пусто - не подключается.
  overridesSecret: ""
  env: [] # дополнительные env в формате контейнера (name/value)
  # Аннотации только пода api (например, k8s.grafana.com/scrape для сбора /metrics агентом Alloy)
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

web:
  enabled: true
  replicas: 1
  port: 3000
  image:
    repository: ghcr.io/vladyslav-dmitriev/human-system-design-web
    tag: ""
    pullPolicy: IfNotPresent
  # Secret с переменными web. Ключи как в apps/web/.env.example (только секретные): NEXTAUTH_SECRET.
  # NEXT_PUBLIC_* здесь не работают: они вшиваются в образ при сборке (см. Dockerfile, стадия web).
  existingSecret: app-web
  env: []
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Несекретные переменные окружения (попадают в ConfigMap)
config:
  api:
    NODE_ENV: production
    SERVER_PORT: "3001"
    PORT: "3001"
    # CLIENT_URL: если пусто, строится из ingress.host (http/https по ingress.tls.enabled)
    CLIENT_URL: ""
    # Платные SMS включаются только значением "enabled" (см. apps/api/.env.example)
    PAID_API: "false"
    SMS_DAILY_LIMIT: "1000"
    EMAIL_PROVIDER: sendgrid
    # EMAIL_FROM обязателен в production: задайте в values окружения или в Secret.
    # Пустые ключи сюда не кладём: ConfigMap и Secret подключены через envFrom, и пустое значение
    # перекрыло бы одноимённый ключ из Secret.
    # Секретные ключи api (Secret api.existingSecret): DATABASE_URL, REDIS_URL, RABBITMQ_URL, JWT_SECRET,
    # AUTH_SECRET, INTERNAL_API_SECRET, EMAIL_VERIFICATION_SECRET, STRIPE_*, AWS_*, SENDGRID_API_KEY /
    # RESEND_API_KEY, TWILIO_*, GOOGLE_CAPTCHA_SECRET_KEY (полный список в образце env для apps/api).
  web:
    NODE_ENV: production
    # next-auth 5 за прокси (Ingress) должен доверять заголовкам Host
    AUTH_TRUST_HOST: "true"
    # Секретные ключи web (Secret web.existingSecret): NEXTAUTH_SECRET (= AUTH_SECRET api),
    # INTERNAL_API_SECRET (тот же, что у api), при необходимости AUTH_COOKIE_DOMAIN.

# Job `prisma migrate deploy` (Helm hook pre-install,pre-upgrade), образ тот же, что у api
migrations:
  enabled: true
  backoffLimit: 10
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

# Job после деплоя (хук post-install,post-upgrade): подтягивает активные цены Stripe в таблицу "Product".
# Образ тот же, что у api. С заглушкой вместо STRIPE_SECRET_KEY (локально) синхронизация пропускается.
productSync:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

# Восстановление базы из бэкапа в R2 на ПУСТОЙ базе (хук pre-install,pre-upgrade, раньше миграций).
# Бэкап делает CronJob postgres-backup в чарте deps. Секрет existingSecret (создаёт infra/scripts/seal-secrets.sh --r2):
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET. Выключено по умолчанию (локально бэкапов нет).
restore:
  enabled: false
  backoffLimit: 3
  activeDeadlineSeconds: 900
  postgresImage: postgres:16-alpine # та же версия, что у Postgres в чарте deps
  rcloneImage: rclone/rclone:1.68.2
  existingSecret: postgres-backup-r2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

ingress:
  enabled: true
  className: traefik # другие классы не поддерживаются: чарт падает (нужны Traefik Middleware)
  host: myapp.local
  annotations: {}
  tls:
    enabled: false
    secretName: app-tls
    # имя ClusterIssuer cert-manager; если пусто, аннотация не добавляется
    clusterIssuer: ""
  # Лимиты тела запроса (nginx: client_max_body_size 1m для web, 6m для /api/)
  limits:
    webBodyBytes: 1048576
    apiBodyBytes: 6291456
  # Заголовки безопасности (паритет с nginx/snippets/*.inc). HSTS только при ingress.tls.enabled.
  headers:
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(self)"
    contentSecurityPolicy: "frame-ancestors 'none'"
    stsSeconds: 31536000
    # Полная CSP пока Report-Only (см. nginx/snippets/csp-report-only.inc). Держать в синхроне с nginx.
    cspReportOnly: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://challenges.cloudflare.com https://cdn.amplitude.com https://cdn.growthbook.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://api.stripe.com https://m.stripe.network https://www.google.com/recaptcha/ https://challenges.cloudflare.com https://*.amplitude.com https://cdn.growthbook.io; frame-src https://js.stripe.com https://hooks.stripe.com https://www.google.com/recaptcha/ https://recaptcha.google.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'"
  traefik:
    # k3s с Traefik v3 и minikube (Helm-чарт Traefik v3): traefik.io. Для Traefik v2: traefik.containo.us/v1alpha1
    apiVersion: traefik.io/v1alpha1

# NetworkPolicy: default-deny входящего трафика + точечные разрешения. Нужен CNI с поддержкой политик.
networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik # k3s: kube-system
  monitoringNamespace: monitoring

metrics:
  serviceMonitor:
    enabled: false # нужны CRD monitoring.coreos.com
    path: /metrics
    interval: 30s
    labels: {}
