apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # раньше приложения app (wave 0), чтобы CRD успели появиться
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: human-system-design
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/vladyslav-dmitriev/human-system-design.git
    targetRevision: main
    path: infra/helm/vendors/monitoring
    helm:
      valueFiles:
        - values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD kube-prometheus-stack слишком большие для client-side apply
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
