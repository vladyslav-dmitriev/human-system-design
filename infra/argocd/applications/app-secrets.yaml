# Зашифрованные секреты приложения (SealedSecret). Контроллер Sealed Secrets расшифровывает их в обычные Secret
# в namespace app: app-deps, app-api, app-web (и app-api-overrides с реальными ключами, когда он есть).
# Файлы создаёт infra/scripts/seal-secrets.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app-secrets
  namespace: argocd
  annotations:
    # после sealed-secrets (CRD SealedSecret) и до deps
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: human-system-design

  source:
    repoURL: https://github.com/vladyslav-dmitriev/human-system-design.git
    targetRevision: main
    path: infra/k8s/app-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
