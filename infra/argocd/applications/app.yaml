apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app
  namespace: argocd

spec:
  project: human-system-design

  source:
    repoURL: https://github.com/vladyslav-dmitriev/human-system-design.git
    targetRevision: main
    path: infra/helm/app

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    # Автосинхронизация выключена (ручной sync). Включить в фазе 5, когда CI подставляет реальный sha-тег:
    # сейчас в values-prod.yaml заглушка тега, образа с таким тегом нет.
    # automated:
    #   prune: true
    #   selfHeal: true

    syncOptions:
      - CreateNamespace=true