apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app
  namespace: argocd

spec:
  project: human-system-design

  source:
    repoURL: https://github.com/vladyslav-dmitriev/human-system-design.git
    targetRevision: main
    path: infra/helm/app

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    # Автосинхронизация: новый коммит в main (в том числе PR от CI с новым тегом образа) выкатывается сам.
    # prune: ресурс, удалённый из git, удаляется и из кластера.
    # selfHeal: ручные правки в кластере (kubectl edit) откатываются к состоянию из git. Менять только через git.
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    # Хуки (миграции Prisma и синхронизация цен Stripe) могут не успеть при холодном старте кластера:
    # БД ещё поднимается. Повторяем несколько раз с растущей паузой.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
