# Sealed Secrets: в git лежат зашифрованные SealedSecret, расшифровать их может только этот контроллер.
# Ключ шифрования живёт в Secret кластера. Сервер у нас одноразовый, поэтому ключ хранится у человека
# (см. infra/scripts/server-bootstrap.sh: восстановление и резервная копия ключа).
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # первым: остальным приложениям нужны расшифрованные секреты
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: human-system-design

  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0 # контроллер 0.41.2
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # имя по умолчанию для kubeseal (--controller-name)
        fullnameOverride: sealed-secrets-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
