apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: human-system-design
  namespace: argocd

spec:
  description: Human System Design (prod на k3s)

  # Откуда ArgoCD вообще разрешено брать манифесты: наш репозиторий и закреплённые Helm-репозитории.
  sourceRepos:
    - https://github.com/vladyslav-dmitriev/human-system-design.git
    - https://charts.jetstack.io
    - https://bitnami.github.io/sealed-secrets
    - https://grafana.github.io/helm-charts

  # Куда разрешено выкатывать. kube-system нужен для Sealed Secrets и конфигурации Traefik (встроен в k3s).
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: app
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: monitoring

  # CRD, ClusterRole и ClusterIssuer нужны cert-manager и Sealed Secrets, поэтому на уровне кластера остаются любые ресурсы.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
